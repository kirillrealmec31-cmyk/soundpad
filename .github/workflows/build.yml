name: build-apk
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: soundpad-apk
          path: soundpad.apk
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${{ github.run_number }}" soundpad.apk --title "Soundpad build ${{ github.run_number }}" --notes "APK"
